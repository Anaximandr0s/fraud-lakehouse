[project]
name = "fraud-lakehouse"
version = "1.0.0"
description = "Real-time fraud detection lakehouse on one laptop with Docker Compose."
readme = "README.md"
license = "MIT"
requires-python = "~=3.10.0"
dependencies = []

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dbt = [
    "dbt-core==1.12.7",
    "dbt-spark[pyhive]==1.11.1",
]
dev = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pre-commit>=4.6.2",
    "prometheus-client>=0.26.0",
    "pyspark==3.5.10",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
]
notebook = [
    "jupyterlab==4.6.6",
    "matplotlib==3.10.9",
    "numpy==2.2.6",
    "pandas==2.3.3",
]
producer = [
    "confluent-kafka>=2.16.1",
    "prometheus-client>=0.26.0",
]

[tool.uv]
default-groups = ["dev", "dbt"]

[tool.coverage.run]
source = ["fraud_lakehouse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
