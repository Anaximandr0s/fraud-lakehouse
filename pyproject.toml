[project]
name = "fraud-lakehouse"
version = "0.1.0"
description = "Real-time fraud detection lakehouse on one laptop with Docker Compose."
readme = "README.md"
license = "MIT"
requires-python = "~=3.10.0"
dependencies = []

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyspark==3.5.9",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
producer = [
    "confluent-kafka>=2.16.1",
]
