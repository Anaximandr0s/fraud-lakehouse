spark.master                              spark://spark-master:7077
# Without a cap, the first application takes every core and starves the others.
spark.cores.max                           2
spark.executor.memory                     640m
spark.sql.session.timeZone                UTC

spark.sql.extensions                      org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
# Iceberg tables in the default catalog, so dbt and Metabase need no catalog prefix.
spark.sql.catalog.spark_catalog           org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type      hive
spark.sql.catalogImplementation           hive
spark.hadoop.hive.metastore.uris          thrift://hive-metastore:9083
spark.sql.warehouse.dir                   s3a://lakehouse/warehouse

# Credentials come from the AWS_* environment variables.
spark.hadoop.fs.s3a.endpoint              http://minio:9000
spark.hadoop.fs.s3a.path.style.access     true
