repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5  # keep in sync with ruff in uv.lock
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      # Notebooks are committed without outputs; make notebook-run writes results to notebooks/out/.
      - id: nbstripout
