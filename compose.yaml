name: fraud-lakehouse

x-spark: &spark
  image: fraud-lakehouse-spark:local
  build:
    context: .
    dockerfile: spark/Dockerfile
    args:
      SPARK_IMAGE: ${SPARK_IMAGE:?}
  restart: unless-stopped

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  AWS_REGION: us-east-1

services:
  minio:
    image: ${MINIO_IMAGE:?}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m

  minio-init:
    # Reuses the MinIO image, which already ships `mc`.
    image: ${MINIO_IMAGE:?}
    entrypoint: ["bash", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing local/lakehouse
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  postgres:
    image: ${POSTGRES_IMAGE:?}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      METASTORE_DB_PASSWORD: ${METASTORE_DB_PASSWORD:?}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 384m

  hive-schema-init:
    # Hive 3's `-initSchema` fails once the schema exists, so it runs only when `-info` finds none.
    image: ${HIVE_IMAGE:?}
    entrypoint: ["bash", "-c"]
    command:
      - for action in -info -initSchema; do
          schematool -dbType postgres "$$action" -driver org.postgresql.Driver
          -url jdbc:postgresql://postgres:5432/metastore
          -userName metastore -passWord "$$METASTORE_DB_PASSWORD" && exit 0;
        done; exit 1
    environment:
      METASTORE_DB_PASSWORD: ${METASTORE_DB_PASSWORD:?}
    volumes:
      # Replaces the image's 2016 driver, which cannot do SCRAM-SHA-256 (the Postgres default).
      - ./jars/hive/postgresql-${POSTGRES_JDBC_VERSION:?}.jar:/opt/hive/lib/postgresql-9.4.1208.jre7.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  hive-metastore:
    image: ${HIVE_IMAGE:?}
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "true"
      # The image already passes -Xmx1G; a later -Xmx wins, which keeps the heap under mem_limit.
      SERVICE_OPTS: >-
        -Xmx384m
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=metastore
        -Djavax.jdo.option.ConnectionPassword=${METASTORE_DB_PASSWORD:?}
        -Dhive.metastore.warehouse.dir=s3a://lakehouse/warehouse
      HIVE_CUSTOM_CONF_DIR: /hive-custom-conf
      # The image ships hadoop-aws in Hadoop's tools dir, which is off the classpath by default.
      HADOOP_OPTIONAL_TOOLS: hadoop-aws
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - ./hive/conf:/hive-custom-conf:ro
      - ./jars/hive/postgresql-${POSTGRES_JDBC_VERSION:?}.jar:/opt/hive/lib/postgresql-9.4.1208.jre7.jar:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/9083"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      hive-schema-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 640m

  spark-master:
    <<: *spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    environment:
      # Daemons default to a 1g heap, above this container's limit.
      SPARK_DAEMON_MEMORY: 256m
      # Without recovery a restarted master forgets running apps, and their drivers wait forever.
      SPARK_MASTER_OPTS: >-
        -Dspark.deploy.recoveryMode=FILESYSTEM
        -Dspark.deploy.recoveryDirectory=/opt/spark/recovery
    volumes:
      - spark-recovery:/opt/spark/recovery
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m

  spark-worker:
    <<: *spark
    # Executors advertise this host to drivers; the default container hostname is not resolvable.
    command: >-
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --host spark-worker spark://spark-master:7077
    environment:
      <<: *s3-env
      SPARK_DAEMON_MEMORY: 256m
      SPARK_WORKER_CORES: 6
      SPARK_WORKER_MEMORY: 1920m
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      spark-master:
        condition: service_healthy
    mem_limit: 3584m

  spark-thrift:
    <<: *spark
    command: >-
      /opt/spark/sbin/start-thriftserver.sh
      --driver-memory 640m
      --conf spark.driver.host=spark-thrift
      --conf spark.scheduler.mode=FAIR
    environment:
      <<: *s3-env
      SPARK_NO_DAEMONIZE: "true"
      # Same glibc arena growth as spark-streaming: under dbt load it filled its 1g limit without it.
      MALLOC_ARENA_MAX: "2"
    ports:
      - "10000:10000"
      - "4041:4040"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/10000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      spark-worker:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    mem_limit: 1g

  spark-streaming:
    <<: *spark
    command: >-
      /opt/spark/bin/spark-submit
      --driver-memory 512m
      --conf spark.driver.host=spark-streaming
      /opt/spark/jobs/streaming.py
    environment:
      <<: *s3-env
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: transactions
      CHECKPOINT_DIR: /opt/spark/checkpoints/streaming
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:?}
      HASH_SALT: ${HASH_SALT:?}
      # glibc gives each thread its own malloc arena: measured 266 MB outside the JVM's own memory, 53 MB with 2.
      MALLOC_ARENA_MAX: "2"
    volumes:
      # Local, not s3a://: checkpoint commits rely on atomic renames, which S3A does not offer.
      - spark-checkpoints:/opt/spark/checkpoints
    ports:
      - "4040:4040"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/4040"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      spark-worker:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    # A 512m driver heap measured 742 MB of JVM RSS, so 768m left no room.
    mem_limit: 1g

  kafka:
    image: ${KAFKA_IMAGE:?}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # Containers reach the broker as kafka:9092, the host as localhost:9094.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # A Kafka CLI tool would start a second JVM inside the memory limit.
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    mem_limit: 768m

  kafka-init:
    image: ${KAFKA_IMAGE:?}
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server=kafka:9092
      - --create
      - --if-not-exists
      - --topic=transactions
      - --partitions=3
      - --config=retention.ms=86400000
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  producer:
    image: fraud-lakehouse-producer:local
    build:
      context: .
      dockerfile: producer/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?}
        UV_IMAGE: ${UV_IMAGE:?}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: transactions
      RATE: ${RATE:?}
      DATA_FILE: /data/fraud_all.csv
      POSITION_FILE: /state/position
      HEARTBEAT_FILE: /tmp/heartbeat
    volumes:
      # Without create_host_path: false, a missing file becomes a root-owned directory.
      - type: bind
        source: ./data/fraud_all.csv
        target: /data/fraud_all.csv
        read_only: true
        bind:
          create_host_path: false
      - producer-state:/state
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/heartbeat -mmin -1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 128m

  airflow:
    image: fraud-lakehouse-airflow:local
    build:
      context: .
      dockerfile: airflow/Dockerfile
      args:
        AIRFLOW_IMAGE: ${AIRFLOW_IMAGE:?}
        UV_IMAGE: ${UV_IMAGE:?}
    profiles: [orchestration]
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Used by SmtpNotifier; STARTTLS on port 587, hence disable_ssl.
      AIRFLOW_CONN_SMTP_DEFAULT: >-
        {"conn_type": "smtp", "host": "${SMTP_HOST:?}", "port": ${SMTP_PORT:?},
        "login": "${SMTP_USER:?}", "password": "${SMTP_PASSWORD:?}",
        "extra": {"from_email": "${SMTP_USER:?}", "disable_ssl": true}}
      ALERT_EMAIL: ${ALERT_EMAIL:?}
      # Links in emails use the host port; tasks still reach the API on the container port.
      AIRFLOW__API__BASE_URL: http://localhost:8082
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      DBT_SPARK_HOST: spark-thrift
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      spark-thrift:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g

volumes:
  minio-data:
  postgres-data:
  spark-recovery:
  kafka-data:
  producer-state:
  spark-checkpoints:
