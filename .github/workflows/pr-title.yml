name: pr-title

# Squash merges use the PR title as the commit subject, so it must follow Conventional Commits.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            docs
            ci
            build
            chore
            perf
          scopes: |
            producer
            spark
            dbt
            airflow
            compose
            monitoring
            ci
            docs
            deps
            deps-dev
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: Start the subject with a lowercase letter and end it without a period.
