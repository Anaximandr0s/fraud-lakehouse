name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - id: lint
        run: make lint
      - id: test
        run: make test | tee pytest.log
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Python"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| lint | ${{ steps.lint.outcome }} |"
            echo "| test | ${{ steps.test.outcome }} |"
            if [ -f pytest.log ]; then
              echo
              echo "pytest: $(tail -n 1 pytest.log | tr -d '=' | xargs)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - id: config
        run: docker compose --env-file .env.example config -q
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Compose"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| docker compose config | ${{ steps.config.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - id: spark
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < spark/Dockerfile
      - id: producer
        if: always()
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < producer/Dockerfile
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Dockerfiles"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| hadolint spark/Dockerfile | ${{ steps.spark.outcome }} |"
            echo "| hadolint producer/Dockerfile | ${{ steps.producer.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
