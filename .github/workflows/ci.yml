name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
          # Keeps the ~300 MB PySpark wheel between runs.
          enable-cache: true
      # PySpark tests need a JVM; 17 matches the Spark image.
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --locked
      - id: lint
        run: make lint
      - id: test
        run: make test | tee pytest.log
      - id: dbt_parse
        run: make dbt args=parse
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Python"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| lint | ${{ steps.lint.outcome }} |"
            echo "| test | ${{ steps.test.outcome }} |"
            echo "| dbt parse | ${{ steps.dbt_parse.outcome }} |"
            if [ -f pytest.log ]; then
              echo
              echo "pytest: $(tail -n 1 pytest.log | tr -d '=' | xargs)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - id: config
        run: docker compose --env-file .env.example --profile '*' config -q
      - id: promtool
        if: always()
        run: >-
          docker run --rm -v "$PWD/monitoring:/monitoring:ro" --entrypoint promtool
          "$(grep '^PROMETHEUS_IMAGE=' .env.example | cut -d= -f2)"
          check config /monitoring/prometheus.yml
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Compose"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| docker compose config | ${{ steps.config.outcome }} |"
            echo "| promtool check config | ${{ steps.promtool.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - id: spark
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < spark/Dockerfile
      - id: producer
        if: always()
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < producer/Dockerfile
      - id: airflow
        if: always()
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < airflow/Dockerfile
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Dockerfiles"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| hadolint spark/Dockerfile | ${{ steps.spark.outcome }} |"
            echo "| hadolint producer/Dockerfile | ${{ steps.producer.outcome }} |"
            echo "| hadolint airflow/Dockerfile | ${{ steps.airflow.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
