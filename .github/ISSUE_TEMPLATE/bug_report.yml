name: Bug report
description: Something in the stack does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of the failing command, or `make logs s=<service>`.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, RAM, `docker compose version`.
    validations:
      required: true
