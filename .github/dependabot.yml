version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The local test SparkSession must match the cluster's Spark 3.5 (SPARK_IMAGE in .env.example).
      - dependency-name: pyspark
        versions: [">=3.6"]
    groups:
      python:
        patterns: ["*"]
