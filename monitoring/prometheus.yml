global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: spark-streaming
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["spark-streaming:4040"]

  - job_name: producer
    static_configs:
      - targets: ["producer:8000"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
