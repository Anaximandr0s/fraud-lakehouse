fraud_lakehouse:
  target: spark
  outputs:
    spark:
      type: spark
      method: thrift
      # localhost from the host (make dbt), spark-thrift inside Airflow.
      host: "{{ env_var('DBT_SPARK_HOST') }}"
      port: 10000
      schema: gold
      threads: 2
      connect_retries: 3
      connect_timeout: 10
